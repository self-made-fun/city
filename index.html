<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Zakazivanje Termina</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #f0f2f5; color: #1c1e21; display: flex; justify-content: center; padding: 15px; }
        .app-card { background: #ffffff; width: 100%; max-width: 480px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); overflow: hidden; padding-bottom: 20px; }
        
        .header { background: linear-gradient(135deg, #075e54, #128c7e); color: white; padding: 25px 20px; text-align: center; }
        .logo-box { width: 85px; height: 85px; background: rgba(255,255,255,0.2); border: 2px dashed rgba(255,255,255,0.6); border-radius: 50%; margin: 0 auto 12px auto; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: bold; text-transform: uppercase; overflow: hidden; }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }
        .header h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
        .header p { font-size: 0.85rem; opacity: 0.9; }

        .content { padding: 20px; }
        .section-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #65676b; margin-bottom: 10px; margin-top: 15px; }

        .service-list { display: flex; flex-direction: column; gap: 8px; }
        .service-item { border: 2px solid #e4e6eb; border-radius: 10px; padding: 12px 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .service-item.selected { border-color: #128c7e; background-color: #e8f5e9; }
        .service-name { font-weight: 600; font-size: 0.95rem; }
        .service-price { font-weight: 700; color: #2e7d32; }

        .date-picker { display: flex; gap: 8px; }
        .date-btn { flex: 1; padding: 10px; border: 2px solid #e4e6eb; border-radius: 10px; text-align: center; cursor: pointer; background: white; font-weight: 600; }
        .date-btn.selected { border-color: #128c7e; background-color: #128c7e; color: white; }

        .time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .time-slot { padding: 10px; border: 1.5px solid #e4e6eb; border-radius: 8px; text-align: center; font-weight: 600; cursor: pointer; background: #f8f9fa; }
        .time-slot.selected { border-color: #128c7e; background: #128c7e; color: white; }
        .time-slot.busy { background: #ffebe9 !important; color: #d32f2f !important; border-color: #ffcdd2 !important; cursor: not-allowed !important; text-decoration: line-through; opacity: 0.65; }

        .input-group { margin-top: 10px; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #4b4f56; }
        .input-group input { width: 100%; padding: 11px; border: 1.5px solid #cccccc; border-radius: 8px; outline: none; }

        .btn-whatsapp { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1.05rem; font-weight: 700; cursor: pointer; color: white; background-color: #25d366; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); margin-top: 20px; }
        .btn-whatsapp:disabled { background-color: #a5d6a7; cursor: wait; }
        .loading { text-align: center; color: #075e54; font-weight: bold; font-size: 0.85rem; padding: 10px; }
    </style>
</head>
<body>

<div class="app-card">
    <div class="header">
        <div class="logo-box" id="logoBox"><span>LOGO</span></div>
        <h1 id="firmaNaziv">Naziv Firme</h1>
        <p id="firmaOpis">Opis poslovanja</p>
    </div>

    <div class="content">
        <div class="section-title">1. Izaberite uslugu</div>
        <div class="service-list" id="servicesContainer"></div>

        <div class="section-title">2. Izaberite dan</div>
        <div class="date-picker" id="dateContainer"></div>

        <div class="section-title">3. Termini (Zauzeti su označeni ❌)</div>
        <div id="loadingStatus" class="loading" style="display:none;">⏳ Učitavam termine iz baze...</div>
        <div class="time-grid" id="timeContainer"></div>

        <div class="section-title">4. Vaši podaci</div>
        <div class="input-group">
            <label>Ime i Prezime *</label>
            <input type="text" id="klijentIme" placeholder="Unesite vaše ime">
        </div>
        <div class="input-group">
            <label id="napomenaLabel">Napomena / Detalji *</label>
            <input type="text" id="klijentNapomena" placeholder="Unesite napomenu">
        </div>

        <button class="btn-whatsapp" id="btnSubmit" onclick="rezervisiWA()">💬 ZAKAŽI PREKO WHATSAPPA</button>
    </div>
</div>

<script>
    // =========================================================================
    // PODEŠAVANJE FIRME
    // =========================================================================
    const FIRMA = {
        naziv: "Frizerski Salon 'BEAUTY'",
        opis: "Brzo i jednostavno zakazivanje termina",
        logoUrl: "", 
        brojTelefona: "38761255417", 
        bazaUrl: "https://script.google.com/macros/s/AKfycbxte3AX5zLPXNYmYpkBNUobKQST9FSM5vXbHlJ8AO0a-mPn0CiaZVlDXkat3OAlhwe_4w/exec",
        labelNapomena: "Napomena / Posebne želje *",
        placeholderNapomena: "npr. Pranje kose i feniranje",
        usluge: [
            { id: 1, naziv: "Muško šišanje + Pranje", cijena: "15 KM" },
            { id: 2, naziv: "Žensko šišanje + Feniranje", cijena: "30 KM" }
        ]
    };

    const SVI_TERMINI = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00"];

    let odabranaUsluga = FIRMA.usluge[0];
    let odabraniDatum = "Danas";
    let odabraniTermin = "";
    let zauzetiTerminiIzBaze = [];

    function inicijalizujPrikaz() {
        document.getElementById('firmaNaziv').innerText = FIRMA.naziv;
        document.getElementById('firmaOpis').innerText = FIRMA.opis;
        document.getElementById('napomenaLabel').innerText = FIRMA.labelNapomena;
        document.getElementById('klijentNapomena').placeholder = FIRMA.placeholderNapomena;

        prikaziUsluge();
        prikaziDatume();
        ucitajBazuIRebuild();
    }

    function prikaziUsluge() {
        document.getElementById('servicesContainer').innerHTML = FIRMA.usluge.map(u => `
            <div class="service-item ${u.id === odabranaUsluga.id ? 'selected' : ''}" onclick="odaberiUslugu(${u.id})">
                <span class="service-name">${u.naziv}</span>
                <span class="service-price">${u.cijena}</span>
            </div>
        `).join('');
    }

    function odaberiUslugu(id) {
        odabranaUsluga = FIRMA.usluge.find(x => x.id === id);
        prikaziUsluge();
    }

    function prikaziDatume() {
        const datumi = ["Danas", "Sutra", "Prekosutra"];
        document.getElementById('dateContainer').innerHTML = datumi.map(d => `
            <div class="date-btn ${d === odabraniDatum ? 'selected' : ''}" onclick="odaberiDatum('${d}')">
                <div>${d}</div>
            </div>
        `).join('');
    }

    function odaberiDatum(d) {
        odabraniDatum = d;
        prikaziDatume();
        ucitajBazuIRebuild();
    }

    async function ucitajBazuIRebuild() {
        document.getElementById('loadingStatus').style.display = 'block';
        zauzetiTerminiIzBaze = [];

        if (FIRMA.bazaUrl && !FIRMA.bazaUrl.includes("OVDJE_ZALIJEPI")) {
            try {
                let queryUrl = `${FIRMA.bazaUrl}?datum=${encodeURIComponent(odabraniDatum)}&_t=${Date.now()}`;
                let res = await fetch(queryUrl, { redirect: 'follow', cache: 'no-store' });
                let json = await res.json();
                
                if (json && json.zauzeti) {
                    zauzetiTerminiIzBaze = json.zauzeti.map(function(t) { return String(t).trim(); });
                }
            } catch (e) {
                console.log("Greška pri čitanju baze:", e);
            }
        }
        
        document.getElementById('loadingStatus').style.display = 'none';
        
        let slobodni = SVI_TERMINI.filter(function(t) {
            return !zauzetiTerminiIzBaze.includes(t);
        });
        odabraniTermin = slobodni.length > 0 ? slobodni[0] : "";
        
        prikaziTermine();
    }

    function odaberiTermin(t) {
        odabraniTermin = t;
        prikaziTermine();
    }

    function prikaziTermine() {
        const container = document.getElementById('timeContainer');

        container.innerHTML = SVI_TERMINI.map(t => {
            const isBusy = zauzetiTerminiIzBaze.includes(t);
            const isSelected = t === odabraniTermin && !isBusy;
            
            if (isBusy) {
                return `<div class="time-slot busy">${t} ❌</div>`;
            } else {
                return `<div class="time-slot ${isSelected ? 'selected' : ''}" onclick="odaberiTermin('${t}')">${t}</div>`;
            }
        }).join('');
    }

    async function rezervisiWA() {
        const ime = document.getElementById('klijentIme').value.trim();
        const napomena = document.getElementById('klijentNapomena').value.trim();
        const btn = document.getElementById('btnSubmit');

        if(!ime || !napomena) {
            alert("Popunite vaše ime i napomenu.");
            return;
        }
        if(!odabraniTermin || zauzetiTerminiIzBaze.includes(odabraniTermin)) {
            alert("Ovaj termin je zauzet. Izaberite drugi.");
            return;
        }

        btn.disabled = true;
        btn.innerText = "⏳ Upisujem u bazu...";

        if (FIRMA.bazaUrl && !FIRMA.bazaUrl.includes("OVDJE_ZALIJEPI")) {
            try {
                let upisUrl = `${FIRMA.bazaUrl}?action=upisi` +
                              `&datum=${encodeURIComponent(odabraniDatum)}` +
                              `&termin=${encodeURIComponent(odabraniTermin)}` +
                              `&usluga=${encodeURIComponent(odabranaUsluga.naziv)}` +
                              `&ime=${encodeURIComponent(ime)}` +
                              `&napomena=${encodeURIComponent(napomena)}` +
                              `&_t=${Date.now()}`;

                await fetch(upisUrl, { redirect: 'follow', cache: 'no-store' });
            } catch (e) {
                console.log("Greška pri upisu:", e);
            }
        }

        const poruka = `🛑 *NOVA REZERVACIJA TERMINA*\n\n` +
                       `🏢 *Objekat:* ${FIRMA.naziv}\n` +
                       `📅 *Dan:* ${odabraniDatum}\n` +
                       `⏰ *Vrijeme:* ${odabraniTermin}h\n` +
                       `🛠️ *Usluga:* ${odabranaUsluga.naziv} (${odabranaUsluga.cijena})\n\n` +
                       `👤 *Klijent:* ${ime}\n` +
                       `📝 *Napomena:* ${napomena}`;
                       
        const encoded = encodeURIComponent(poruka);
        
        btn.disabled = false;
        btn.innerText = "💬 ZAKAŽI PREKO WHATSAPPA";

        if (!zauzetiTerminiIzBaze.includes(odabraniTermin)) {
            zauzetiTerminiIzBaze.push(odabraniTermin);
        }
        
        let slobodni = SVI_TERMINI.filter(function(t) {
            return !zauzetiTerminiIzBaze.includes(t);
        });
        odabraniTermin = slobodni.length > 0 ? slobodni[0] : "";
        
        prikaziTermine();

        window.open(`https://wa.me/${FIRMA.brojTelefona}?text=${encoded}`, '_blank');
    }

    inicijalizujPrikaz();
</script>

</body>
</html>
