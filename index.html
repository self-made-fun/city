<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Zakazivanje Termina</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
        button { width: 100%; background: #25d366; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background: #1ebe5d; }
        #loading { display: none; text-align: center; color: #666; margin-top: 10px; }
        #response-msg { display: none; margin-top: 15px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

<div class="card">
    <h2>Zakazivanje Termina</h2>
    <form id="bookingForm">
        <div class="form-group">
            <label for="ime">Ime i prezime:</label>
            <input type="text" id="ime" name="ime" required placeholder="Npr. Amar Ramić">
        </div>
        <div class="form-group">
            <label for="telefon">Broj mobitela (WhatsApp):</label>
            <input type="tel" id="telefon" name="telefon" required placeholder="Npr. +38761255417">
        </div>
        <div class="form-group">
            <label for="usluga">Odaberite uslugu:</label>
            <select id="usluga" name="usluga" required>
                <option value="">-- Izaberi uslugu --</option>
                <option value="Usluga 1">Osnovna usluga / Pregled</option>
                <option value="Usluga 2">Standardna obrada</option>
                <option value="Usluga 3">Napredni paket</option>
            </select>
        </div>
        <div class="form-group">
            <label for="datum">Datum:</label>
            <input type="date" id="datum" name="datum" required>
        </div>
        <div class="form-group">
            <label for="vrijeme">Vrijeme:</label>
            <input type="time" id="vrijeme" name="vrijeme" required>
        </div>
        <div class="form-group">
            <label for="napomena">Napomena (opcionalno):</label>
            <textarea id="napomena" name="napomena" rows="3" placeholder="Dodatni zahtjevi..."></textarea>
        </div>
        
        <button type="submit" id="submitBtn">Potvrdi rezervaciju</button>
        <div id="loading">Slanje podataka u bazu... Pričekajte.</div>
    </form>
    
    <div id="response-msg"></div>
</div>

<script>
    // OVDJE ZALIJEPI SVOJ GOOGLE APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywBvAiPwqibtga9g0LAgnyuw4D1XhXqYs9KeiWGhoC1nh4EDAhXsO4hPQhDzpW5DqQ5Q/exec";

    document.getElementById('bookingForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const msgBox = document.getElementById('response-msg');
        
        submitBtn.style.display = 'none';
        loading.style.display = 'block';
        msgBox.style.display = 'none';

        const formData = {
            ime: document.getElementById('ime').value,
            telefon: document.getElementById('telefon').value,
            usluga: document.getElementById('usluga').value,
            datum: document.getElementById('datum').value,
            vrijeme: document.getElementById('vrijeme').value,
            napomena: document.getElementById('napomena').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Nužno za Google Apps Script Web App
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            // Pošto no-cors vraća prazan odgovor, pretpostavljamo uspjeh i obrađujemo lokalno
            loading.style.display = 'none';
            msgBox.className = 'response-msg success';
            msgBox.innerHTML = 'Uspješno ste zakazali termin! Podaci su spremljeni.';
            msgBox.style.display = 'block';
            
            // Opcionalno: Otvaranje WhatsApp-a automatski ka tebi
            let adminPhone = "38761123456"; // Tvoj broj
            let text = `Pozdrav, nova rezervacija:%nIme: ${formData.ime}%nUsluga: ${formData.usluga}%nTermin: ${formData.datum} u ${formData.vrijeme}`;
            // window.open(`https://wa.me/${adminPhone}?text=${encodeURIComponent(text)}`, '_blank');

            document.getElementById('bookingForm').reset();
            setTimeout(() => { submitBtn.style.display = 'block'; }, 3000);
        })
        .catch(error => {
            loading.style.display = 'none';
            submitBtn.style.display = 'block';
            msgBox.className = 'response-msg error';
            msgBox.innerHTML = 'Greška pri slanju. Pokušajte ponovo.';
            msgBox.style.display = 'block';
            console.error('Error!', error);
        });
    });
</script>

</body>
</html>
