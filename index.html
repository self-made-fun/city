<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zakazivanje termina</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { max-width: 500px; margin: 20px auto; padding: 16px; background: #f5f5f5; }
  .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 16px; }
  h2 { margin-top: 0; color: #075E54; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; font-size: 14px; }
  input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
  button { background: #25D366; color: #fff; border: 0; padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; width: 100%; margin-top: 16px; cursor: pointer; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .msg { padding: 10px; border-radius: 8px; margin-top: 12px; font-size: 14px; display: none; }
  .msg.ok { background: #d4edda; color: #155724; display: block; }
  .msg.err { background: #f8d7da; color: #721c24; display: block; }
  .slot { display: inline-block; padding: 8px 12px; margin: 4px; border: 2px solid #25D366; border-radius: 8px; cursor: pointer; background: #fff; }
  .slot.selected { background: #25D366; color: #fff; }
</style>
</head>
<body>

<div class="card">
  <h2>📅 Zakaži termin</h2>
  
  <label>Datum</label>
  <input type="date" id="date" onchange="loadSlots()">
  
  <label>Slobodni termini</label>
  <div id="slots">Izaberi datum...</div>
  
  <label>Usluga</label>
  <input type="text" id="service" placeholder="npr. Šišanje">
  
  <label>Ime i prezime</label>
  <input type="text" id="name" placeholder="Marko Marković">
  
  <label>Telefon (npr. 381641234567)</label>
  <input type="tel" id="phone" placeholder="381641234567">
  
  <label>Napomena (opciono)</label>
  <textarea id="note" rows="2"></textarea>
  
  <button onclick="book()" id="btnBook">Zakaži i pošalji na WhatsApp</button>
  <div class="msg" id="msg"></div>
</div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbz_dBjOWyu_k9-pgGOkWstyoIIXjFjK2qN8E6yXE9_gpf1xNA7b9smp-ouzwbaQG6CcTg/exec'; // zameni posle deploy-a
  let selectedSlot = null;

  async function loadSlots() {
    const date = document.getElementById('date').value;
    if (!date) return;
    const el = document.getElementById('slots');
    el.textContent = 'Učitavam...';
    selectedSlot = null;

    try {
      const res = await fetch(`${API}?action=getSlots&date=${date}`);
      const slots = await res.json();
      if (!slots.length) { el.textContent = 'Nema slobodnih termina.'; return; }
      el.innerHTML = slots.map(s =>
        `<span class="slot" onclick="pickSlot(${s.id}, this)">${s.time} - ${s.service}</span>`
      ).join('');
    } catch (e) {
      el.textContent = 'Greška pri učitavanju.';
    }
  }

  function pickSlot(id, el) {
    selectedSlot = id;
    document.querySelectorAll('.slot').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
  }

  async function book() {
    const msg = document.getElementById('msg');
    msg.className = 'msg';

    if (!selectedSlot) return showMsg('Izaberi termin.', 'err');
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    if (!name || !phone) return showMsg('Unesi ime i telefon.', 'err');

    const btn = document.getElementById('btnBook');
    btn.disabled = true;
    btn.textContent = 'Šaljem...';

    try {
      const params = new URLSearchParams({
        action: 'book',
        id: selectedSlot,
        name, phone,
        note: document.getElementById('note').value
      });
      const res = await fetch(`${API}?${params}`);
      const data = await res.json();

      if (data.status === 'success') {
        showMsg('✅ Termin zakazan! Otvaram WhatsApp...', 'ok');
        // AUTOMATSKO OTVARANJE WHATSAPP-A SA PORUKOM
        window.open(data.whatsappLink, '_blank');
      } else {
        showMsg('❌ ' + data.message, 'err');
      }
    } catch (e) {
      showMsg('Greška: ' + e.message, 'err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Zakaži i pošalji na WhatsApp';
    }
  }

  function showMsg(text, type) {
    const msg = document.getElementById('msg');
    msg.textContent = text;
    msg.className = 'msg ' + type;
  }
</script>

</body>
</html>
